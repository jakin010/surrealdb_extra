[workspace]
resolver = "2"
members = [
    "surrealdb_extra",
    "surrealdb_extra_derive",
    "surrealdb_extra_tests",
]

[workspace.dependencies]
surrealdb = { version = "4.0" }
surrealdb-types = { version = "4.0" }
serde = { version = "1.0.229" }

[workspace.package]
version = "0.13.1"
edition = "2024"
