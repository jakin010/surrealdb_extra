[package]
name = "surrealdb_extra"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "Table trait and integer enum derive for SurrealDB, built on surrealdb-types"
readme = "crates-io.md"
documentation = "https://docs.rs/surrealdb_extra"
repository = "https://github.com/jakin010/surrealdb_extra"
keywords = ["surrealdb", "surrealdb_extra", "derive", "table", "database"]
categories = ["database", "database-implementations"]

[dependencies]
surrealdb_extra_derive = { version = "0.13.1", path = "../surrealdb_extra_derive" }
surrealdb-types = { workspace = true }

[features]
default = ["table"]
table = ["surrealdb_extra_derive/table"]
repr = ["surrealdb_extra_derive/repr"]

# docs.rs-specific configuration
[package.metadata.docs.rs]
# document all features
all-features = true
# defines the configuration attribute `docsrs`
rustdoc-args = ["--cfg", "docsrs"]
